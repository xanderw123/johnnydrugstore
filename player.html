<!DOCTYPE html>
<html>
<head>
    <title>Johnny Drugstore - Media Player</title>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
        }
        
        .side-column {
            width: 100px;
            background-color: #000000;
            background-image: url('images/side-tile.gif');
            background-repeat: repeat-y;
        }
        
        .header {
            background-color: #000000;
            padding: 20px;
            text-align: center;
            border: 1px solid #ffffff;
        }
        
        .header h1 {
            font-size: 42px;
            font-style: italic;
            font-weight: 700;
            color: #ff3399;
            margin: 0;
            letter-spacing: 1px;
        }
        
        .header .tagline {
            font-size: 11px;
            color: #ffffff;
            margin: 8px 0 0 0;
        }
        
        .sidebar {
            width: 150px;
            background-color: #000000;
            padding: 15px;
            border: 1px solid #ffffff;
            vertical-align: top;
        }
        
        .sidebar h3 {
            font-size: 12px;
            font-weight: 700;
            color: #ff3399;
            margin: 0 0 5px 0;
        }
        
        .sidebar hr {
            border: none;
            border-top: 1px solid #ff3399;
            margin: 5px 0 15px 0;
        }
        
        .sidebar hr.thin {
            border-top: 1px solid #ffffff;
            opacity: 0.3;
            margin: 20px 0;
        }
        
        .sidebar p {
            font-size: 11px;
            margin: 8px 0;
            line-height: 1.4;
        }
        
        .sidebar a {
            color: #ffffff;
            text-decoration: underline;
        }
        
        .sidebar a:hover {
            color: #ff3399;
        }
        
        .sidebar .current {
            font-weight: 700;
            text-decoration: none;
        }
        
        .sidebar .status-dot {
            color: #ff3399;
            font-size: 10px;
        }
        
        .sidebar .counter {
            background-color: #000000;
            border: 1px solid #ffffff;
            padding: 5px;
            text-align: center;
            margin-top: 8px;
        }
        
        .sidebar .counter span {
            font-family: "Courier New", monospace;
            font-size: 9px;
            color: #ff3399;
        }
        
        .main-content {
            background-color: #000000;
            padding: 60px 40px;
            border: 1px solid #ffffff;
            vertical-align: middle;
            text-align: center;
        }
        
        #webamp {
            display: inline-block;
            margin: 40px auto;
        }
        
        /* Center the Webamp windows */
        #webamp > div {
            position: relative !important;
            margin: 0 auto !important;
            left: auto !important;
            top: auto !important;
        }
        
        .footer {
            background-color: #000000;
            padding: 15px;
            text-align: center;
            border: 1px solid #ffffff;
        }
        
        .footer p {
            font-size: 8px;
            color: #666666;
            margin: 3px 0;
            line-height: 1.5;
        }
        
        .footer a {
            color: #666666;
            text-decoration: none;
        }
        
        .footer a:hover {
            color: #ff3399;
        }
    </style>
</head>
<body>

<table width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
        <td class="side-column">&nbsp;</td>
        
        <td width="800">
            <table width="800" border="0" cellspacing="0" cellpadding="0" align="center">
                <tr>
                    <td colspan="2" class="header">
                        <h1>Johnny Drugstore</h1>
                        <p class="tagline">The Number 1 Broadcast in all of the Nine Cities</p>
                    </td>
                </tr>
                
                <tr>
                    <td class="sidebar">
                        <h3>NAVIGATION</h3>
                        <hr>
                        <p><a href="index.html">HOME</a></p>
                        <p><a href="stream.html">STREAM</a></p>
                        <p class="current">PLAYER</p>
                        <p><a href="support.html">SUPPORT</a></p>
                        <p><a href="store.html">STORE</a></p>
                        
                        <hr class="thin">
                        
                        <h3>STATUS</h3>
                        <hr>
                        <p class="status-dot">● LIVE 24/7</p>
                        
                        <hr class="thin">
                        
                        <h3>VISITORS</h3>
                        <hr>
                        <div class="counter">
                            <span>999,999,999</span>
                        </div>
                    </td>
                    
                    <td class="main-content">
                        <div id="webamp"></div>
                    </td>
                </tr>
                
                <tr>
                    <td colspan="2" class="footer">
                        <p>Johnny Drugstore is property of <a href="https://xwindustries.net">XW Industries</a></p>
                        <p>Copyright © 1997. All Rights Reserved.</p>
                    </td>
                </tr>
            </table>
        </td>
        
        <td class="side-column">&nbsp;</td>
    </tr>
</table>

<script src="https://unpkg.com/webamp@1.5.0/built/webamp.bundle.min.js"></script>

<script>
    const webamp = new Webamp({
        initialSkin: {
            url: "/skins/XW_VIDEO_PLAYER_SKIN.wsz"
        },
        initialTracks: [
            {
                metaData: {
                    artist: "JOHNNY DRUGSTORE",
                    title: "broadcast"
                },
                url: "/audio/mix-01.mp3"
            }
        ]
    });
    
    webamp.renderWhenReady(document.getElementById('webamp')).then(() => {
    console.log('Webamp loaded, attempting to position...');
    
    let attempts = 0;
    const positionInterval = setInterval(() => {
        const windows = document.querySelectorAll('.webamp .window, #webamp .window');
        
        console.log('Attempt', attempts, 'found', windows.length, 'windows');
        
        if (windows.length > 0) {
            windows.forEach((win, index) => {
                console.log('Positioning window', index);
                
                if (index === 0) {  // Main player
                    win.style.left = '500px';
                    win.style.top = '300px';
                    win.style.position = 'fixed';
                } else if (index === 1) {  // Equalizer
                    win.style.left = '500px';
                    win.style.top = '350px';  // Below main player (300 + 116 + 4px gap)
                    win.style.position = 'fixed';
                } else if (index === 2) {  // Playlist
                    win.style.left = '500px';
                    win.style.top = '400px';  // Below equalizer
                    win.style.position = 'fixed';
                }
            });
            
            attempts++;
            if (attempts > 10) {
                clearInterval(positionInterval);
            }
        }
    }, 100);
});
</script>

</body>
</html>
