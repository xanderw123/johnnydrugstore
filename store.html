<!DOCTYPE html>
<html>
<head>
    <title>Johnny Drugstore - Store</title>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
        }
        
        .side-column {
            width: 100px;
            background-color: #000000;
            background-image: url('images/side-tile.gif');
            background-repeat: repeat-y;
        }
        
        .header {
            background-color: #000000;
            padding: 20px;
            text-align: center;
            border: 1px solid #ffffff;
        }
        
        .header h1 {
            font-size: 42px;
            font-style: italic;
            font-weight: 700;
            color: #ff3399;
            margin: 0;
            letter-spacing: 1px;
        }
        
        .header .tagline {
            font-size: 11px;
            color: #ffffff;
            margin: 8px 0 0 0;
        }
        
        .sidebar {
            width: 150px;
            background-color: #000000;
            padding: 15px;
            border: 1px solid #ffffff;
            vertical-align: top;
        }
        
        .sidebar h3 {
            font-size: 12px;
            font-weight: 700;
            color: #ff3399;
            margin: 0 0 5px 0;
        }
        
        .sidebar hr {
            border: none;
            border-top: 1px solid #ff3399;
            margin: 5px 0 15px 0;
        }
        
        .sidebar hr.thin {
            border-top: 1px solid #ffffff;
            opacity: 0.3;
            margin: 20px 0;
        }
        
        .sidebar p {
            font-size: 11px;
            margin: 8px 0;
            line-height: 1.4;
        }
        
        .sidebar a {
            color: #ffffff;
            text-decoration: underline;
        }
        
        .sidebar a:hover {
            color: #ff3399;
        }
        
        .sidebar .current {
            font-weight: 700;
            text-decoration: none;
        }
        
        .sidebar .status-dot {
            color: #ff3399;
            font-size: 10px;
        }
        
        .sidebar .counter {
            background-color: #000000;
            border: 1px solid #ffffff;
            padding: 5px;
            text-align: center;
            margin-top: 8px;
        }
        
        .sidebar .counter span {
            font-family: "Courier New", monospace;
            font-size: 9px;
            color: #ff3399;
        }
        
        .main-content {
            background-color: #000000;
            padding: 80px 40px;
            border: 1px solid #ffffff;
            vertical-align: middle;
            text-align: center;
        }
        
        .main-content h2 {
            font-size: 24px;
            font-weight: 700;
            color: #ff3399;
            margin: 0 0 30px 0;
            letter-spacing: 2px;
        }
        
        .main-content p {
            font-size: 12px;
            line-height: 1.8;
            margin: 15px 0;
        }
        
        .footer {
            background-color: #000000;
            padding: 15px;
            text-align: center;
            border: 1px solid #ffffff;
        }
        
        .footer p {
            font-size: 8px;
            color: #666666;
            margin: 3px 0;
            line-height: 1.5;
        }
        
        .footer a {
            color: #666666;
            text-decoration: none;
        }
        
        .footer a:hover {
            color: #ff3399;
        }
    </style>
</head>
<body>

<table width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
        <td class="side-column">&nbsp;</td>
        
        <td width="800">
            <table width="800" border="0" cellspacing="0" cellpadding="0" align="center">
                <tr>
                    <td colspan="2" class="header">
                        <h1>Johnny Drugstore</h1>
                        <p class="tagline">The Number 1 Broadcast in all of the Nine Cities</p>
                    </td>
                </tr>
                
                <tr>
                    <td class="sidebar">
                        <h3>NAVIGATION</h3>
                        <hr>
                        <p><a href="index.html">HOME</a></p>
                        <p><a href="stream.html">STREAM</a></p>
                        <p><a href="player.html">PLAYER</a></p>
                        <p class="current">STORE</p>
                        <p><a href="support.html">SUPPORT</a></p>
                        
                        <hr class="thin">
                        
                        <h3>STATUS</h3>
                        <hr>
                        <p class="status-dot">● LIVE 24/7</p>
                        
                        <hr class="thin">
                        
                        <h3>VISITORS</h3>
                        <hr>
                        <div class="counter">
                            <span>999,999,999</span>
                        </div>
                    </td>
                    
                    <td class="main-content">
                        <h2>STORE</h2>
                        <p>Merchandise will be available soon.</p>
                    </td>
                </tr>
                
                <tr>
                    <td colspan="2" class="footer">
                        <p>Johnny Drugstore is property of <a href="https://xwindustries.net">XW Industries</a></p>
                        <p>Copyright © 1997. All Rights Reserved.</p>
                    </td>
                </tr>
            </table>
        </td>
        
        <td class="side-column">&nbsp;</td>
    </tr>
</table>

</body>
</html>
