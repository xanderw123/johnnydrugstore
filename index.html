<!DOCTYPE html>
<html>
<head>
    <title>Johnny Drugstore</title>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
    <style>
        .nav-button {
    display: inline-block;
    padding: 18px 50px;
    margin: 0 10px;
    background-color: #000000;
    border: 3px solid #ffffff;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: 1px;
}

.nav-button:hover {
    background-color: #ffffff;
    color: #000000;
}
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
        }
        
        .side-column {
            width: 100px;
            background-color: #000000;
            background-image: url('images/side-tile.gif');
            background-repeat: repeat-y;
        }
        
        .header {
            background-color: #000000;
            padding: 20px;
            text-align: center;
            border: 1px solid #ffffff;
        }
        
        .header h1 {
            font-size: 42px;
            font-style: italic;
            font-weight: 700;
            color: #ff3399;
            margin: 0;
            letter-spacing: 1px;
        }
        
        .header .tagline {
            font-size: 11px;
            color: #ffffff;
            margin: 8px 0 0 0;
        }
        
        .sidebar {
            width: 150px;
            background-color: #000000;
            padding: 15px;
            border: 1px solid #ffffff;
            vertical-align: top;
        }
        
        .sidebar h3 {
            font-size: 12px;
            font-weight: 700;
            color: #ff3399;
            margin: 0 0 5px 0;
        }
        
        .sidebar hr {
            border: none;
            border-top: 1px solid #ff3399;
            margin: 5px 0 15px 0;
        }
        
        .sidebar hr.thin {
            border-top: 1px solid #ffffff;
            opacity: 0.3;
            margin: 20px 0;
        }
        
        .sidebar p {
            font-size: 11px;
            margin: 8px 0;
            line-height: 1.4;
        }
        
        .sidebar a {
            color: #ffffff;
            text-decoration: underline;
        }
        
        .sidebar a:hover {
            color: #ff3399;
        }
        
        .sidebar .current {
            font-weight: 700;
            text-decoration: none;
        }
        
        .sidebar .status-dot {
            color: #ff3399;
            font-size: 10px;
        }
        
        .sidebar .counter {
            background-color: #000000;
            border: 1px solid #ffffff;
            padding: 5px;
            text-align: center;
            margin-top: 8px;
        }
        
        .sidebar .counter span {
            font-family: "Courier New", monospace;
            font-size: 9px;
            color: #ff3399;
        }
        
        .main-content {
            background-color: #000000;
            padding: 80px 40px;
            border: 1px solid #ffffff;
            vertical-align: middle;
            text-align: center;
        }
        
        .buttons {
            margin: 60px 0;
        }
        
        .button {
            display: inline-block;
            padding: 20px 50px;
            background-color: #000000;
            border: 3px solid #ff3399;
            color: #ff3399;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            margin: 0 15px;
            letter-spacing: 1px;
        }
        
        .button:hover {
            background-color: #ff3399;
            color: #000000;
        }
        
        .button.secondary {
            border-color: #ffffff;
            color: #ffffff;
        }
        
        .button.secondary:hover {
            background-color: #ffffff;
            color: #000000;
        }
        
        .footer {
            background-color: #000000;
            padding: 15px;
            text-align: center;
            border: 1px solid #ffffff;
        }
        
        .footer p {
            font-size: 8px;
            color: #666666;
            margin: 3px 0;
            line-height: 1.5;
        }
        
        .footer a {
            color: #666666;
            text-decoration: none;
        }
        
        .footer a:hover {
            color: #ff3399;
        }
    </style>
</head>
<body>

<table width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
        <!-- Left decorative column -->
        <td class="side-column">&nbsp;</td>
        
        <!-- Main content area -->
        <td width="800">
            <table width="800" border="0" cellspacing="0" cellpadding="0" align="center">
                <!-- Header -->
                <tr>
                    <td colspan="2" class="header">
                        <h1>Johnny Drugstore</h1>
                        <p class="tagline">The Number 1 Broadcast in all of the Nine Cities</p>
                    </td>
                </tr>
                
                <!-- Content row -->
                <tr>
                    <!-- Sidebar -->
                    <td class="sidebar">
                        <h3>NAVIGATION</h3>
                        <hr>
                        <p class="current">HOME</p>
                        <p><a href="live.html">LIVE</a></p>
                        <p><a href="player.html">PLAYER</a></p>
                        <p><a href="store.html">STORE</a></p>
                        
                        <hr class="thin">
                        
                        <h3>STATUS</h3>
                        <hr>
                        <p class="status-dot">● LIVE 24/7</p>
                        
                        <hr class="thin">
                        
                        <h3>VISITORS</h3>
                        <hr>
                        <div class="counter">
                            <span>999,999,999</span>
                        </div>
                    </td>
                    
                    <!-- Main content -->
                    <td class="main-content">
    <img src="images/tower.gif" alt="" style="display: block; margin: 0 auto 20px; width: 32px; height: 32px;">
    
    <p style="font-size: 11px; color: #ff3399; margin-bottom: 30px;">● LIVE 24/7</p>
                      
    <div style="margin: 40px 0;">
    <a href="live.html" class="nav-button">LIVE</a>
    <a href="player.html" class="nav-button">PLAYER</a>
</div>
    
    <p style="font-size: 10px; margin: 30px 0 0; opacity: 0.7;">WARNING: may cause drowsiness.</p>
</td>
                </tr>
                
                <!-- Footer -->
                <tr>
                    <td colspan="2" class="footer">
                        <p>Johnny Drugstore is property of <a href="https://xwindustries.net">XW Industries</a></p>
                        <p>Copyright © 1997. All Rights Reserved.</p>
                    </td>
                </tr>
            </table>
        </td>
        
        <!-- Right decorative column -->
        <td class="side-column">&nbsp;</td>
    </tr>
</table>

</body>
</html>
