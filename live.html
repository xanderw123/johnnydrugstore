<!DOCTYPE html>
<html>
<head>
    <title>Johnny Drugstore - Live Broadcast 24/7</title>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
        }
        
        .side-column {
            width: 100px;
            background-color: #000000;
            background-image: url('images/side-tile.gif');
            background-repeat: repeat-y;
        }
        
        .header {
            background-color: #000000;
            padding: 20px;
            text-align: center;
            border: 1px solid #ffffff;
        }
        
        .header h1 {
            font-size: 42px;
            font-style: italic;
            font-weight: 700;
            color: #ff3399;
            margin: 0;
            letter-spacing: 1px;
        }
        
        .header .tagline {
            font-size: 11px;
            color: #ffffff;
            margin: 8px 0 0 0;
        }
        
        .sidebar {
            width: 150px;
            background-color: #000000;
            padding: 15px;
            border: 1px solid #ffffff;
            vertical-align: top;
        }
        
        .sidebar h3 {
            font-size: 12px;
            font-weight: 700;
            color: #ff3399;
            margin: 0 0 5px 0;
        }
        
        .sidebar hr {
            border: none;
            border-top: 1px solid #ff3399;
            margin: 5px 0 15px 0;
        }
        
        .sidebar hr.thin {
            border-top: 1px solid #ffffff;
            opacity: 0.3;
            margin: 20px 0;
        }
        
        .sidebar p {
            font-size: 11px;
            margin: 8px 0;
            line-height: 1.4;
        }
        
        .sidebar a {
            color: #ffffff;
            text-decoration: underline;
        }
        
        .sidebar a:hover {
            color: #ff3399;
        }
        
        .sidebar .current {
            font-weight: 700;
            text-decoration: none;
        }
        
        .sidebar .status-dot {
            color: #ff3399;
            font-size: 10px;
        }
        
        .sidebar .counter {
            background-color: #000000;
            border: 1px solid #ffffff;
            padding: 5px;
            text-align: center;
            margin-top: 8px;
        }
        
        .sidebar .counter span {
            font-family: "Courier New", monospace;
            font-size: 9px;
            color: #ff3399;
        }
        
        .main-content {
            background-color: #000000;
            padding: 40px;
            border: 1px solid #ffffff;
            vertical-align: middle;
            text-align: center;
        }
        
        /* XW Media Player Frame */
        .player-frame {
            display: inline-block;
            background-color: #c0c0c0;
            border: 2px solid #808080;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            padding: 2px;
            box-shadow: inset -1px -1px 0 #000000, inset 1px 1px 0 #ffffff;
        }
        
        .player-titlebar {
            background-color: #000080;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
        }
        
        .player-titlebar-text {
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        
        .player-controls {
            display: flex;
            gap: 2px;
        }
        
        .player-control-btn {
            width: 16px;
            height: 14px;
            background-color: #c0c0c0;
            border: 1px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            font-size: 9px;
            line-height: 12px;
            text-align: center;
            color: #000000;
            font-family: Arial, sans-serif;
            font-weight: 700;
        }
        
        .player-video-container {
            background-color: #000000;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            position: relative;
            width: 640px;
            height: 480px; /* 4:3 aspect ratio */
        }
        
        .player-video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .player-branding {
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: #808080;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        
        .footer {
            background-color: #000000;
            padding: 15px;
            text-align: center;
            border: 1px solid #ffffff;
        }
        
        .footer p {
            font-size: 8px;
            color: #666666;
            margin: 3px 0;
            line-height: 1.5;
        }
        
        .footer a {
            color: #666666;
            text-decoration: none;
        }
        
        .footer a:hover {
            color: #ff3399;
        }
    </style>
</head>
<body>

<table width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
        <td class="side-column">&nbsp;</td>
        
        <td width="800">
            <table width="800" border="0" cellspacing="0" cellpadding="0" align="center">
                <tr>
                    <td colspan="2" class="header">
                        <h1>Johnny Drugstore</h1>
                        <p class="tagline">The Number 1 Broadcast in all of the Nine Cities</p>
                    </td>
                </tr>
                
                <tr>
                    <td class="sidebar">
                        <h3>NAVIGATION</h3>
                        <hr>
                        <p><a href="index.html">HOME</a></p>
                        <p class="current">LIVE</p>
                        <p><a href="player.html">PLAYER</a></p>
                        <p><a href="store.html">STORE</a></p>
                        
                        <hr class="thin">
                        
                        <h3>STATUS</h3>
                        <hr>
                        <p class="status-dot">● LIVE 24/7</p>
                        
                        <hr class="thin">
                        
                        <h3>VISITORS</h3>
                        <hr>
                        <div class="counter">
                            <span>999,999,999</span>
                        </div>
                    </td>
                    
                    <td class="main-content">
    <div style="display: inline-block; background-color: #b0b0b0; padding: 3px; border: 1px solid #5a5a5a;">
        <div style="background-color: #2a2a2a; padding: 3px;">
            <iframe 
                src="https://www.youtube.com/embed/IP8qO7zCML0?autoplay=0&controls=1..."
                width="640" 
                height="480"
                style="border: none; display: block;"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>
</td>
                </tr>
                
                <tr>
                    <td colspan="2" class="footer">
                        <p>Johnny Drugstore is property of <a href="https://xwindustries.net">XW Industries</a></p>
                        <p>Copyright © 1997. All Rights Reserved.</p>
                    </td>
                </tr>
            </table>
        </td>
        
        <td class="side-column">&nbsp;</td>
    </tr>
</table>

</body>
</html>
